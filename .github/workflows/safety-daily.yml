# Generated by scripts/build-jobs.mjs from chalamalasetti/PV-Info .github/workflows/safety-daily.yml.
# Do not edit here: change the source file in PV-Info; the "Sync jobs from PV-Info" workflow rebuilds this.
name: Check US label changes (DailyMed) and PMDA alerts
on:
  schedule:
    - cron: 41 5,17 * * *
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: safety-data
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chalamalasetti/PV-Info
          ref: main
          token: ${{ secrets.PVINFO_CODE_TOKEN }}
          persist-credentials: false
      - name: Use the public data repository as origin
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check DailyMed for new label versions
        run: node scripts/safety-data/dailymed.mjs --out output/safety-daily
      - name: Publish the label files without an app deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PVINFO_DATA_TOKEN }}
          script: |
            await require('./scripts/safety-data/publish.cjs')({github,context,core,directory:'output/safety-daily',title:'US label and PMDA check'});
