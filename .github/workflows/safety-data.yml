# Generated by scripts/build-jobs.mjs from chalamalasetti/PV-Info .github/workflows/safety-data.yml.
# Do not edit here: change the source file in PV-Info; the "Sync jobs from PV-Info" workflow rebuilds this.
name: Refresh product safety snapshot
on:
  schedule:
    - cron: 17 6 * * 0
  workflow_dispatch:
    inputs:
      limit:
        description: Most substances to cover
        default: "5000"
      scope:
        description: all (every US Orange Book and biologics ingredient) or manifest (Company Explorer companies only)
        default: all
      minutes:
        description: Most minutes for openFDA requests (the job stops itself and publishes)
        default: "150"
permissions:
  contents: write
concurrency:
  group: safety-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chalamalasetti/PV-Info
          ref: main
          token: ${{ secrets.PVINFO_CODE_TOKEN }}
          persist-credentials: false
      - name: Use the public data repository as origin
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Collect openFDA safety counts
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
          LIMIT: ${{ inputs.limit || '5000' }}
          SCOPE: ${{ inputs.scope || 'all' }}
          MAX_MINUTES: ${{ inputs.minutes || '150' }}
        run: node scripts/safety-data/collect.mjs --out output/safety-data --limit "$LIMIT" --scope "$SCOPE" --minutes "$MAX_MINUTES"
      - name: Publish checksum-verified safety snapshot without an app deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PVINFO_DATA_TOKEN }}
          script: |
            await require('./scripts/safety-data/publish.cjs')({github,context,core});
