# Generated by scripts/build-jobs.mjs from chalamalasetti/PV-Info .github/workflows/country-products.yml.
# Do not edit here: change the source file in PV-Info; the "Sync jobs from PV-Info" workflow rebuilds this.
name: Refresh country product registries
on:
  schedule:
    - cron: 43 3 * * 0
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: country-product-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chalamalasetti/PV-Info
          ref: main
          token: ${{ secrets.PVINFO_CODE_TOKEN }}
          persist-credentials: false
      - name: Use the public data repository as origin
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect official source snapshots
        continue-on-error: true
        run: python scripts/country-products/build.py --out output/country-products
      - name: Publish checksum-verified country shards without an app deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PVINFO_DATA_TOKEN }}
          script: |
            await require('./scripts/country-products/publish.cjs')({github,context,core});
