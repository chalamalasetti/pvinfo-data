# Generated by scripts/build-jobs.mjs from chalamalasetti/PV-Info .github/workflows/literature.yml.
# Do not edit here: change the source file in PV-Info; the "Sync jobs from PV-Info" workflow rebuilds this.
name: Collect public literature pilot
on:
  schedule:
    - cron: 17 7 * * 0
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: pv-public-literature
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main' && vars.PV_LITERATURE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chalamalasetti/PV-Info
          ref: main
          token: ${{ secrets.PVINFO_CODE_TOKEN }}
          persist-credentials: false
      - name: Use the public data repository as origin
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check private runner configuration
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          DATA_TOKEN: ${{ secrets.PVINFO_DATA_TOKEN }}
        run: |
          test -n "$NCBI_EMAIL" && test -n "$DATA_TOKEN" || { echo 'Private collector configuration is missing. No requests or publication performed.'; exit 1; }
      - name: Restore the public metadata branch
        run: |
          remote=https://github.com/chalamalasetti/pvinfo-data.git
          directory="$RUNNER_TEMP/pv-public-literature"
          git init --quiet "$directory"
          git -C "$directory" remote add origin "$remote"
          refs=$(git ls-remote --heads "$remote" literature-data-cache)
          if [ -n "$refs" ]; then
            git -C "$directory" fetch --depth=1 origin literature-data-cache
            git -C "$directory" checkout --quiet -b literature-data-cache FETCH_HEAD
          else
            git -C "$directory" checkout --quiet --orphan literature-data-cache
          fi
      - name: Collect complete public-name searches
        id: collect
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: node scripts/literature/hosted-collect.mjs --directory "$RUNNER_TEMP/pv-public-literature"
      - name: Publish metadata and coverage atomically
        env:
          DATA_TOKEN: ${{ secrets.PVINFO_DATA_TOKEN }}
        run: |
          directory="$RUNNER_TEMP/pv-public-literature"
          git -C "$directory" config user.name 'github-actions[bot]'
          git -C "$directory" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$directory" add index.json objects
          if git -C "$directory" diff --cached --quiet; then exit 0; fi
          git -C "$directory" commit --quiet -m 'Refresh public PubMed ingredient metadata and coverage'
          # Normal fast-forward push rejects a changed remote head; never force.
          git -C "$directory" -c http.https://github.com/.extraheader= push "https://x-access-token:${DATA_TOKEN}@github.com/chalamalasetti/pvinfo-data.git" HEAD:literature-data-cache
      - name: Mark incomplete collections unsuccessful
        if: steps.collect.outputs.failed != '0'
        run: echo 'One or more target collections failed. Prior evidence retained; inspect latest attempt and freshness.' && exit 1
