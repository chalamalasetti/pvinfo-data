# Generated by scripts/build-jobs.mjs from chalamalasetti/PV-Info .github/workflows/curated-requirements.yml.
# Do not edit here: change the source file in PV-Info; the "Sync jobs from PV-Info" workflow rebuilds this.
name: Publish curated requirements
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Optional PV-Info branch or commit to publish now
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: curated-requirements
  cancel-in-progress: false
jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - id: pick
        name: Find the newest curation commit not yet published
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PVINFO_CODE_TOKEN }}
          script: |-
            const owner = 'chalamalasetti', repo = 'PV-Info', wanted = '${{ inputs.ref }}'.trim();
            const paths = ["scripts/document-catalog/curation","scripts/curation"];
            if (wanted) { core.setOutput('sha', wanted); return; }
            const branches = (await github.paginate(github.rest.repos.listBranches, {owner, repo, per_page: 100})).map(b => b.name).filter(n => n === 'main' || n.startsWith('claude/'));
            let newest = null;
            for (const branch of branches) for (const path of paths) {
              const {data} = await github.rest.repos.listCommits({owner, repo, sha: branch, path, per_page: 1});
              const c = data[0]; if (!c) continue;
              const date = new Date(c.commit.committer.date);
              if (!newest || date > newest.date) newest = {sha: c.sha, date, branch};
            }
            if (!newest) { core.info('No curation commits found.'); core.setOutput('sha', ''); return; }
            let published = new Date(0);
            try {
              const r = await fetch('https://api.github.com/repos/${{ github.repository }}/branches/curated-requirements', {headers: {authorization: 'Bearer ${{ github.token }}'}});
              if (r.ok) published = new Date((await r.json()).commit.commit.committer.date);
            } catch (e) { core.warning('Could not read the published branch: ' + e.message); }
            core.info(`Newest curation commit: ${newest.branch} ${newest.sha.slice(0, 7)} at ${newest.date.toISOString()}; last publish ${published.toISOString()}`);
            core.setOutput('sha', newest.date > published ? newest.sha : '');
  publish:
    needs: pick
    if: needs.pick.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chalamalasetti/PV-Info
          ref: ${{ needs.pick.outputs.sha }}
          token: ${{ secrets.PVINFO_CODE_TOKEN }}
          persist-credentials: false
      - name: Use the public data repository as origin
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch captured document texts
        run: git fetch origin document-text-cache --depth=1 && git worktree add /tmp/text origin/document-text-cache
      - name: Check curation files and build payloads
        run: node scripts/curation/build-payloads.mjs scripts/document-catalog/curation /tmp/text /tmp/curated
      - name: Publish to the data repository
        env:
          DATA_TOKEN: ${{ secrets.PVINFO_DATA_TOKEN }}
        run: |
          cd /tmp/curated
          printf '%s\n' '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q -b curated-requirements
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "Curated requirements $(date -u +%FT%TZ)"
          git -c http.https://github.com/.extraheader= push -qf "https://x-access-token:${DATA_TOKEN}@github.com/chalamalasetti/pvinfo-data.git" HEAD:curated-requirements
