# Generated by scripts/build-jobs.mjs from chalamalasetti/PV-Info .github/workflows/company-registry.yml.
# Do not edit here: change the source file in PV-Info; the "Sync jobs from PV-Info" workflow rebuilds this.
name: Refresh company registry
on:
  schedule:
    - cron: 9 1-23/6 * * *
  workflow_dispatch:
    inputs:
      force:
        description: Run immediately even if paused or not due
        type: boolean
        default: true
permissions:
  contents: write
  id-token: write
concurrency:
  group: company-registry
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chalamalasetti/PV-Info
          ref: main
          token: ${{ secrets.PVINFO_CODE_TOKEN }}
          persist-credentials: false
      - name: Use the public data repository as origin
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check managed schedule and acquire run lease
        id: managed
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: node scripts/refresh-control.mjs claim products
      - name: Read previous product data
        if: steps.managed.outputs.run == 'true'
        run: bash scripts/read-product-cache.sh
      - name: Build the registry
        id: collect
        if: steps.managed.outputs.run == 'true'
        run: |
          npm run registry
          cp companies/registry.json /tmp/refresh-products-result.json
      - name: Stage product registry without an app deployment
        id: publish
        if: steps.managed.outputs.run == 'true'
        env:
          DATA_TOKEN: ${{ secrets.PVINFO_DATA_TOKEN }}
        run: |
          test -n "$DATA_TOKEN" || { echo 'PVINFO_DATA_TOKEN secret is missing'; exit 1; }
          DATA_REMOTE=https://github.com/chalamalasetti/pvinfo-data.git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads "$DATA_REMOTE" product-data-cache >/dev/null; then
            git fetch --depth=1 "$DATA_REMOTE" product-data-cache:refs/remotes/data/product-data-cache
            git worktree add -B product-data-cache /tmp/product-publication data/product-data-cache
          else
            git worktree add --orphan -b product-data-cache /tmp/product-publication
          fi
          cp companies/registry.json /tmp/product-publication/registry.json
          cp companies/substance-products.json /tmp/product-publication/substance-products.json
          git -C /tmp/product-publication add registry.json substance-products.json
          git -C /tmp/product-publication diff --cached --quiet && { echo 'Product data unchanged'; exit 0; }
          git -C /tmp/product-publication commit -q -m 'Stage company and substance source products atomically'
          git -C /tmp/product-publication -c http.https://github.com/.extraheader= push "https://x-access-token:${DATA_TOKEN}@github.com/chalamalasetti/pvinfo-data.git" HEAD:product-data-cache
      - name: Record managed collection outcome
        if: always() && steps.managed.outputs.run == 'true'
        env:
          RUN_LEASE: ${{ steps.managed.outputs.lease }}
          RUN_RESULT: ${{ steps.collect.outcome }}
          PUBLICATION: ${{ steps.publish.outcome }}
        run: node scripts/refresh-control.mjs finish products
