# Generated by scripts/build-jobs.mjs from chalamalasetti/PV-Info .github/workflows/evidence-repository.yml.
# Do not edit here: change the source file in PV-Info; the "Sync jobs from PV-Info" workflow rebuilds this.
name: Build evidence repository
on:
  schedule:
    - cron: 23 4 * * 6
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: evidence-repository
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chalamalasetti/PV-Info
          ref: main
          token: ${{ secrets.PVINFO_CODE_TOKEN }}
          persist-credentials: false
      - name: Use the public data repository as origin
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - name: Reserve disk for bulk label data on this ephemeral runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h /tmp
      - name: Build complete source-linked repository
        run: python scripts/evidence/build.py --out output/evidence
      - name: Publish immutable downloadable snapshot
        env:
          GH_TOKEN: ${{ secrets.PVINFO_DATA_TOKEN }}
          GH_REPO: chalamalasetti/pvinfo-data
          DATA_TAG: evidence-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh release create "$DATA_TAG" output/evidence/assets/* --target main --title "PV Info evidence dataset $DATA_TAG" --notes-file evidence/README.md --latest=false
      - name: Publish verified indexes and atomic manifest
        uses: actions/github-script@v7
        env:
          DATA_TAG: evidence-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          github-token: ${{ secrets.PVINFO_DATA_TOKEN }}
          retries: 3
          script: |
            const publish=require('./scripts/evidence/publish.cjs');
            await publish({github,context,core});
