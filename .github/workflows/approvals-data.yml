# Generated by scripts/build-jobs.mjs from chalamalasetti/PV-Info .github/workflows/approvals-data.yml.
# Do not edit here: change the source file in PV-Info; the "Sync jobs from PV-Info" workflow rebuilds this.
name: Refresh approvals timeline data
on:
  schedule:
    - cron: 23 4 * * 1
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: approvals-data-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chalamalasetti/PV-Info
          ref: main
          token: ${{ secrets.PVINFO_CODE_TOKEN }}
          persist-credentials: false
      - name: Use the public data repository as origin
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read the staged product registry (ingredient links)
        run: bash scripts/read-product-cache.sh || true
      - name: Download and parse FDA, EMA and Health Canada approvals
        run: node scripts/approvals/collect.mjs --out output/approvals
      - name: Check every source parsed (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          node -e "const m=require('./output/approvals/manifest.json');console.table(m.sources.map(s=>({id:s.id,ok:s.ok,records:s.records,earliest:s.earliest,error:s.error||''})));const z=require('zlib'),fs=require('fs'),dec={};for(const f of m.files.filter(f=>f.name.startsWith('y-'))){const d=JSON.parse(z.gunzipSync(fs.readFileSync('output/approvals/'+f.path)));for(const r of d.records){const k=r.m+' '+r.d.slice(0,3)+'0s';dec[k]=(dec[k]||0)+1;}}console.log(Object.entries(dec).sort().map(e=>e.join(': ')).join('\\n'));if(m.sources.some(s=>!s.ok))process.exit(1)"
      - name: Publish checksum-verified approvals data without an app deployment
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PVINFO_DATA_TOKEN }}
          script: |
            await require('./scripts/approvals/publish.cjs')({github,context,core});
