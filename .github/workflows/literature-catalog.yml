# Generated by scripts/build-jobs.mjs from chalamalasetti/PV-Info .github/workflows/literature-catalog.yml.
# Do not edit here: change the source file in PV-Info; the "Sync jobs from PV-Info" workflow rebuilds this.
name: Collect finite literature catalog batches
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Measurement (25 targets), single batch (100), or finite series (up to 40 campaign batches; at most 240 runner-minutes). Check account usage first.
        required: true
        default: measurement
        type: choice
        options:
          - measurement
          - single
          - series
permissions:
  contents: read
concurrency:
  group: pv-public-literature
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main' && vars.PV_LITERATURE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.mode == 'series' && 240 || 6 }}
    steps:
      - name: Reserve whole-job publication headroom
        env:
          MODE: ${{ inputs.mode }}
        run: |
          # Leave one minute outside this deadline for runner/setup variance.
          # The collector reserves another minute for durable publication.
          if [ "$MODE" = series ]; then budget=14340000; else budget=300000; fi
          echo "PV_LITERATURE_RUN_DEADLINE_MS=$(( $(date +%s%3N) + budget ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: chalamalasetti/PV-Info
          ref: main
          token: ${{ secrets.PVINFO_CODE_TOKEN }}
          persist-credentials: false
      - name: Use the public data repository as origin
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        timeout-minutes: 3
      - name: Check private runner configuration
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          DATA_TOKEN: ${{ secrets.PVINFO_DATA_TOKEN }}
        run: |
          test -n "$NCBI_EMAIL" && test -n "$DATA_TOKEN" || { echo 'Private collector configuration is missing. No requests or publication performed.'; exit 1; }
      - name: Restore the public metadata branch
        run: |
          directory="$RUNNER_TEMP/pv-public-literature"
          git init --quiet "$directory"
          git -C "$directory" remote add origin https://github.com/chalamalasetti/pvinfo-data.git
          timeout 45s git -C "$directory" fetch --depth=1 origin literature-data-cache
          git -C "$directory" checkout --quiet -b literature-data-cache FETCH_HEAD
          git -C "$directory" config user.name 'github-actions[bot]'
          git -C "$directory" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Collect and publish bounded resumable batches
        env:
          MODE: ${{ inputs.mode }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          DATA_TOKEN: ${{ secrets.PVINFO_DATA_TOKEN }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/pv-public-literature"
          case "$MODE" in
            measurement) count=1; args=(--measurement) ;;
            single) count=1; args=() ;;
            series) count=40; args=() ;;
            *) echo 'Invalid batch mode.'; exit 1 ;;
          esac
          for ((batch=1; batch<=count; batch++)); do
            # Each source unit is bounded. A failed process stops the series;
            # previously committed evidence remains usable.
            # Startup/import failures can include private source excerpts. Never
            # stream collector diagnostics to public Actions logs or artifacts.
            if ! timeout 300s node scripts/literature/catalog-collect.mjs --directory "$directory" "${args[@]}" > "$RUNNER_TEMP/literature-catalog-outcome.json" 2> /dev/null; then
              echo 'Catalog collector failed. Diagnostics withheld to protect private application code; no batch published.'
              exit 1
            fi
            git -C "$directory" add catalog-index.json objects
            if ! git -C "$directory" diff --cached --quiet; then
              git -C "$directory" commit --quiet -m 'Collect a finite public PubMed catalog baseline batch'
              # A normal push rejects a concurrent change. Never force or retry
              # failed publication automatically, which would lose budget state.
              timeout 45s git -C "$directory" -c http.https://github.com/.extraheader= push "https://x-access-token:${DATA_TOKEN}@github.com/chalamalasetti/pvinfo-data.git" HEAD:literature-data-cache
            fi
            # Print only the collector's safe summary, never source responses.
            cat "$RUNNER_TEMP/literature-catalog-outcome.json"
            decision=$(node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));console.log(['rate-limit','source-outage'].includes(r.stopped)?'stop-error':['idle','cooldown','job-deadline'].includes(r.stopped)||r.batchesCompleted>=r.maxBatches||r.pending+r.retrying===0?'done':'continue');" "$RUNNER_TEMP/literature-catalog-outcome.json")
            if [ "$decision" = stop-error ]; then echo 'Source rate limit or outage: progress published, series stopped. Retry later after reviewing the recorded next retry time.'; exit 1; fi
            if [ "$decision" = done ]; then break; fi
          done
