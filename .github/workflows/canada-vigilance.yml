# Generated by scripts/build-jobs.mjs from chalamalasetti/PV-Info .github/workflows/canada-vigilance.yml.
# Do not edit here: change the source file in PV-Info; the "Sync jobs from PV-Info" workflow rebuilds this.
name: Canada Vigilance counts
on:
  schedule:
    - cron: 23 4 9 * *
  workflow_dispatch:
    inputs:
      url:
        description: Data extract zip URL (from the Health Canada data extract page)
        default: https://www.canada.ca/content/dam/hc-sc/migration/hc-sc/dhp-mps/alt_formats/zip/medeff/databasdon/extract_extrait.zip
permissions:
  contents: write
concurrency:
  group: safety-data
  cancel-in-progress: false
jobs:
  canada:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chalamalasetti/PV-Info
          ref: main
          token: ${{ secrets.PVINFO_CODE_TOKEN }}
          persist-credentials: false
      - name: Use the public data repository as origin
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download and unzip the Canada Vigilance extract
        env:
          URL: ${{ inputs.url || 'https://www.canada.ca/content/dam/hc-sc/migration/hc-sc/dhp-mps/alt_formats/zip/medeff/databasdon/extract_extrait.zip' }}
        run: |
          case "$URL" in https://www.canada.ca/*|https://health-products.canada.ca/*) ;; *) echo "Only canada.ca URLs are allowed"; exit 1;; esac
          curl -fsSL --retry 3 -A "PVInfo-data-job" -D headers.txt -o extract.zip "$URL"
          unzip -q -o extract.zip -d cv
          date -u -d "$(grep -i '^last-modified:' headers.txt | cut -d' ' -f2- | tr -d '\r')" +%F > extract-date.txt 2>/dev/null || date -u +%F > extract-date.txt
          ls -R cv | head -40
      - name: Count reports per ingredient and reaction term
        run: node --max-old-space-size=6144 scripts/safety-data/canada-vigilance.mjs --dir cv --out output/canada-vigilance --extract-date "$(cat extract-date.txt)"
      - name: Publish the canada-vigilance file without an app deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PVINFO_DATA_TOKEN }}
          script: |
            await require('./scripts/safety-data/publish.cjs')({github,context,core,directory:'output/canada-vigilance',title:'Canada Vigilance counts'});
