# Generated by scripts/build-jobs.mjs from chalamalasetti/PV-Info .github/workflows/documents.yml.
# Do not edit here: change the source file in PV-Info; the "Sync jobs from PV-Info" workflow rebuilds this.
name: Collect regulatory source documents
on:
  schedule:
    - cron: 17 * * * *
  workflow_dispatch:
    inputs:
      document_id:
        description: Optional active source ID to prioritize in the bounded batch
        type: string
        default: ""
      admin_capture:
        description: Optional admin-supplied PDF on the data repository's admin-captures branch, as <document-id>/<sha256>.pdf (for agencies that block automated downloads)
        type: string
        default: ""
permissions:
  contents: write
  id-token: write
concurrency:
  group: pv-regulatory-documents
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PV_DOCUMENT_PRIORITY: ${{ github.event_name == 'workflow_dispatch' && inputs.document_id || github.event_name == 'push' && 'ema-gvp-vi-addendum-ii' || '' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chalamalasetti/PV-Info
          ref: main
          token: ${{ secrets.PVINFO_CODE_TOKEN }}
          persist-credentials: false
      - name: Use the public data repository as origin
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Load previous public extraction index
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            fs.mkdirSync('/tmp/pv-document-snapshots', {recursive:true});
            try {
              const r = await github.rest.repos.getContent({...context.repo, path:'index.json', ref:'regulatory-document-cache'});
              fs.writeFileSync('/tmp/pv-document-snapshots/index.json', Buffer.from(r.data.content, 'base64'));
            } catch(e) { if(e.status !== 404) throw e; }
      - name: Collect official public copies and deliver using short-lived GitHub identity
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.admin_capture) }}
        run: node scripts/document-collector.mjs --snapshot-dir=/tmp/pv-document-snapshots
      - name: Deliver an admin-supplied copy of an official PDF
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.admin_capture }}
        env:
          ADMIN_CAPTURE: ${{ inputs.admin_capture }}
        run: |
          [[ "$ADMIN_CAPTURE" =~ ^[a-z0-9][a-z0-9-]{2,79}/[a-f0-9]{64}\.pdf$ ]] || { echo "Invalid admin capture path"; exit 1; }
          git fetch --depth=1 origin admin-captures
          git show "FETCH_HEAD:$ADMIN_CAPTURE" > /tmp/admin-capture.pdf
          node scripts/document-collector.mjs --admin-capture="$ADMIN_CAPTURE" --admin-file=/tmp/admin-capture.pdf
      - name: Publish public key information even when some sources fail
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            if (!fs.existsSync('/tmp/pv-document-snapshots/index.json')) return;
            await require('./scripts/document-snapshot-publish.cjs')({github, context, directory:'/tmp/pv-document-snapshots'});
