# Generated by scripts/build-jobs.mjs from chalamalasetti/PV-Info .github/workflows/regulatory-dates.yml.
# Do not edit here: change the source file in PV-Info; the "Sync jobs from PV-Info" workflow rebuilds this.
name: Refresh regulatory calendar dates
on:
  schedule:
    - cron: 41 5 * * 2
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: regulatory-dates-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chalamalasetti/PV-Info
          ref: main
          token: ${{ secrets.PVINFO_CODE_TOKEN }}
          persist-credentials: false
      - name: Use the public data repository as origin
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Collect regulatory dates from official registers
        run: node scripts/regulatory-dates/collect.mjs --out output/regulatory-dates
      - name: Check every source parsed (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          node -e "const m=require('./output/regulatory-dates/manifest.json');console.table(m.sources.map(s=>({id:s.id,ok:s.ok,records:s.records,earliest:s.earliest,latest:s.latest,error:s.error||''})));console.log(JSON.stringify(m.counts));if(m.sources.some(s=>!s.ok))process.exit(1)"
      - name: Publish checksum-verified dates without an app deployment
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PVINFO_DATA_TOKEN }}
          script: |
            await require('./scripts/regulatory-dates/publish.cjs')({github,context,core});
