# Generated by scripts/build-jobs.mjs from chalamalasetti/PV-Info .github/workflows/fda-collector.yml.
# Do not edit here: change the source file in PV-Info; the "Sync jobs from PV-Info" workflow rebuilds this.
name: Refresh public PV data
on:
  schedule:
    - cron: 23 * * * *
  workflow_dispatch:
    inputs:
      force:
        description: Refresh data immediately even if paused or not due
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
  id-token: write
concurrency:
  group: fda-feed-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chalamalasetti/PV-Info
          ref: main
          token: ${{ secrets.PVINFO_CODE_TOKEN }}
          persist-credentials: false
      - name: Use the public data repository as origin
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check managed schedule and acquire run lease
        id: managed
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: node scripts/refresh-control.mjs claim updates
      - name: Read current publication settings
        if: steps.managed.outputs.run == 'true'
        env:
          RUN_LEASE: ${{ steps.managed.outputs.lease }}
        run: node scripts/runtime-collect.mjs prepare
      - name: Read latest product cache
        if: steps.managed.outputs.run == 'true'
        run: bash scripts/read-product-cache.sh
      - name: Read previous snapshot
        if: steps.managed.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PVINFO_DATA_TOKEN }}
          script: |
            const fs = require('fs'), { DATA_REPO } = require('./scripts/data-repo.cjs');
            try {
              const r = await github.rest.repos.getContent({...DATA_REPO, path:'fda-feeds.json', ref:'fda-feed-cache'});
              fs.writeFileSync('/tmp/previous-fda.json', Buffer.from(r.data.content, 'base64'));
            } catch (e) { if (e.status !== 404) throw e; }
      - name: Collect from FDA using active source settings
        id: collect
        if: steps.managed.outputs.run == 'true'
        env:
          PV_REGISTRY_PATH: /tmp/runtime-source-registry.json
        run: node scripts/fda-snapshot.mjs /tmp/fda-feeds.json /tmp/previous-fda.json
      - name: Publish sanitized snapshot
        if: steps.managed.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PVINFO_DATA_TOKEN }}
          script: |
            const fs = require('fs'), { DATA_REPO } = require('./scripts/data-repo.cjs');
            const branch = 'fda-feed-cache';
            try { await github.rest.git.getRef({...DATA_REPO, ref:`heads/${branch}`}); }
            catch(e) {
              if(e.status !== 404) throw e;
              const main = await github.rest.git.getRef({...DATA_REPO, ref:'heads/main'});
              await github.rest.git.createRef({...DATA_REPO, ref:`refs/heads/${branch}`, sha:main.data.object.sha});
            }
            let sha;
            try { sha = (await github.rest.repos.getContent({...DATA_REPO, path:'fda-feeds.json', ref:branch})).data.sha; }
            catch(e) { if(e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({...DATA_REPO, branch, path:'fda-feeds.json', sha,
              message:'Refresh privacy-screened official FDA feeds', content:fs.readFileSync('/tmp/fda-feeds.json').toString('base64')});
      - name: Publish complete runtime data snapshot
        id: publish
        if: steps.managed.outputs.run == 'true'
        env:
          RUN_LEASE: ${{ steps.managed.outputs.lease }}
          REFRESH_MINUTES: ${{ steps.managed.outputs.frequency }}
        run: node scripts/runtime-collect.mjs
      - name: Record managed collection outcome
        if: always() && steps.managed.outputs.run == 'true'
        env:
          RUN_LEASE: ${{ steps.managed.outputs.lease }}
          RUN_RESULT: ${{ steps.collect.outcome }}
          PUBLICATION: ${{ steps.publish.outcome }}
        run: node scripts/refresh-control.mjs finish updates
