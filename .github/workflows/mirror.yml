# Generated by scripts/build-jobs.mjs from chalamalasetti/PV-Info .github/workflows/mirror.yml.
# Do not edit here: change the source file in PV-Info; the "Sync jobs from PV-Info" workflow rebuilds this.
name: Mirror repository off GitHub
on:
  schedule:
    - cron: 37 2 * * *
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: mirror
  cancel-in-progress: true
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Push a full mirror
        env:
          MIRROR_URL: ${{ secrets.MIRROR_URL }}
          SRC_TOKEN: ${{ secrets.PVINFO_CODE_TOKEN }}
        run: |
          if [ -z "$MIRROR_URL" ]; then echo 'MIRROR_URL secret not set; skipping backup.'; exit 0; fi
          git clone --quiet --mirror "https://x-access-token:${SRC_TOKEN}@github.com/chalamalasetti/PV-Info.git" /tmp/mirror.git
          git -C /tmp/mirror.git push --quiet --prune "$MIRROR_URL" '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
          echo "Mirrored $(git -C /tmp/mirror.git for-each-ref refs/heads refs/tags | wc -l) branches and tags."
