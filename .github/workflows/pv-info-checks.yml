# Generated by scripts/build-jobs.mjs from chalamalasetti/PV-Info .github/workflows/ci.yml.
# Do not edit here: change the source file in PV-Info; the "Sync jobs from PV-Info" workflow rebuilds this.
name: PV-Info checks
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      sha:
        description: Optional PV-Info commit SHA to check now
        type: string
        default: ""
      recheck:
        description: Check again even if a result was already posted
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pv-info-checks
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - id: plan
        name: Find new PV-Info commits to check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PVINFO_CODE_TOKEN }}
          script: |-
            // A pull request is tested as GitHub's merge commit with main (as pull_request CI did), so a
            // branch made before a newer test landed on main is not failed for it. The result is posted on
            // the pull request's head commit.
            const owner = 'chalamalasetti', repo = 'PV-Info', wanted = '${{ inputs.sha }}'.trim(), recheck = '${{ inputs.recheck }}' === 'true';
            const targets = [];
            const MERGE = 'PV-Info checks / merge';
            // A merge-conflict error is replaced once GitHub reports the pull request as mergeable again.
            const clearMerge = async sha => {
              const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {owner, repo, ref: sha, per_page: 100});
              const last = statuses.find(s => s.context === MERGE);
              if (last && last.state !== 'success') await github.rest.repos.createCommitStatus({owner, repo, sha, state: 'success', context: MERGE, description: 'No conflicts with main'});
            };
            if (wanted) {
              targets.push({sha: wanted, ref: wanted, label: 'manual'});
              const prs = (await github.rest.repos.listPullRequestsAssociatedWithCommit({owner, repo, commit_sha: wanted})).data.filter(p => p.state === 'open' && p.head.sha === wanted);
              for (const p of prs) if ((await github.rest.pulls.get({owner, repo, pull_number: p.number})).data.mergeable === true) await clearMerge(wanted);
            }
            else {
              const pulls = await github.paginate(github.rest.pulls.list, {owner, repo, state: 'open', sort: 'updated', direction: 'desc', per_page: 100});
              const main = (await github.rest.repos.getBranch({owner, repo, branch: 'main'})).data.commit.sha;
              const candidates = [{sha: main, ref: main, label: 'main'}];
              for (const p of pulls) {
                if (p.head.repo?.full_name?.toLowerCase() !== 'chalamalasetti/pv-info') continue;
                candidates.push({sha: p.head.sha, number: p.number, label: '#' + p.number});
              }
              for (const c of candidates) {
                if (targets.length >= 4) break;
                if (targets.some(t => t.sha === c.sha)) continue;
                if (!recheck) {
                  const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {owner, repo, ref: c.sha, per_page: 100});
                  if (statuses.some(s => s.context.startsWith('PV-Info checks /') && s.context !== MERGE)) continue;
                }
                if (c.number) {
                  const pr = (await github.rest.pulls.get({owner, repo, pull_number: c.number})).data;
                  // GitHub computes mergeability in the background after a push; null means not yet known.
                  if (pr.mergeable === null || (pr.mergeable && !pr.merge_commit_sha)) { core.info(c.label + ': mergeability not computed yet; next run'); continue; }
                  if (pr.mergeable === false) {
                    const last = (await github.paginate(github.rest.repos.listCommitStatusesForRef, {owner, repo, ref: c.sha, per_page: 100})).find(s => s.context === MERGE);
                    if (last?.state !== 'error') await github.rest.repos.createCommitStatus({owner, repo, sha: c.sha, state: 'error', context: MERGE, description: 'Has merge conflicts with main; resolve them to run the checks'});
                    continue;
                  }
                  await clearMerge(c.sha);
                  // GitHub refreshes the merge commit lazily after main moves; test only an up-to-date one
                  // (asking for the pull request above starts the refresh, so a later poll picks it up).
                  const cmp = await github.rest.repos.compareCommitsWithBasehead({owner, repo, basehead: main + '...' + pr.merge_commit_sha});
                  if (cmp.data.behind_by > 0) { core.info(c.label + ': merge commit not refreshed yet; next run'); continue; }
                  c.ref = pr.merge_commit_sha;
                }
                targets.push(c);
              }
            }
            core.info('Commits to check: ' + (targets.map(t => t.label + ' ' + t.sha.slice(0, 7)).join(', ') || 'none'));
            core.setOutput('targets', JSON.stringify(targets));
  test:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Mark the PV-Info commit as being checked
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PVINFO_CODE_TOKEN }}
          script: |-
            const state = 'pending';
            await github.rest.repos.createCommitStatus({owner: 'chalamalasetti', repo: 'PV-Info', sha: '${{ matrix.target.sha }}', state,
              context: 'PV-Info checks / test', target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: state === 'pending' ? 'Running in pvinfo-data' : 'Ran in pvinfo-data: ' + state});
      - uses: actions/checkout@v4
        with:
          repository: chalamalasetti/PV-Info
          ref: ${{ matrix.target.ref }}
          token: ${{ secrets.PVINFO_CODE_TOKEN }}
          persist-credentials: false
      - name: Use the public data repository as origin
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Dependency vulnerability check
        run: npm run security:audit
      - name: Live feed check
        continue-on-error: true
        run: npm run aggregate
      - name: Official document reachability (read-only; no ingestion)
        continue-on-error: true
        run: npm run documents:probe
      - name: FDA warning-letter export check
        continue-on-error: true
        run: INSPECTIONS_FDA=1 node scripts/inspections/fda-warning-letters.mjs --probe
      - name: Company registry source check
        continue-on-error: true
        run: npm run registry
      - name: Post the result on the PV-Info commit
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PVINFO_CODE_TOKEN }}
          script: |-
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({owner: 'chalamalasetti', repo: 'PV-Info', sha: '${{ matrix.target.sha }}', state,
              context: 'PV-Info checks / test', target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: state === 'pending' ? 'Running in pvinfo-data' : 'Ran in pvinfo-data: ' + state});
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
  company-browser:
