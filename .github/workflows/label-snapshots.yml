# Generated by scripts/build-jobs.mjs from chalamalasetti/PV-Info .github/workflows/label-snapshots.yml.
# Do not edit here: change the source file in PV-Info; the "Sync jobs from PV-Info" workflow rebuilds this.
name: Collect confirmed label snapshots
on:
  schedule:
    - cron: 43 3,15 * * *
  workflow_dispatch: null
permissions:
  contents: read
  id-token: write
concurrency:
  group: pv-hosted-label-snapshots
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chalamalasetti/PV-Info
          ref: main
          token: ${{ secrets.PVINFO_CODE_TOKEN }}
          persist-credentials: false
      - name: Use the public data repository as origin
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Restore, collect and checkpoint confirmed public families
        run: node scripts/label-snapshots/hosted-collect.mjs
