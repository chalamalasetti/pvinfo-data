# Generated by scripts/build-jobs.mjs from chalamalasetti/PV-Info .github/workflows/document-text.yml.
# Do not edit here: change the source file in PV-Info; the "Sync jobs from PV-Info" workflow rebuilds this.
name: Document text for requirement curation
on:
  schedule:
    - cron: 47 5 * * *
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: pv-document-text
  cancel-in-progress: false
jobs:
  text:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chalamalasetti/PV-Info
          ref: main
          token: ${{ secrets.PVINFO_CODE_TOKEN }}
          persist-credentials: false
      - name: Use the public data repository as origin
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-spa tesseract-ocr-por tesseract-ocr-fra tesseract-ocr-jpn tesseract-ocr-kor tesseract-ocr-chi-sim tesseract-ocr-chi-tra
      - name: Previous text cache
        run: |
          git fetch origin document-text-cache --depth=1 && git worktree add /tmp/text origin/document-text-cache || { mkdir -p /tmp/text; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/document-text.mjs /tmp/text
      - name: Publish text cache
        run: |
          cd /tmp/text
          if [ ! -d .git ] && [ ! -f .git ]; then git init -q -b document-text-cache; fi
          git checkout -q -B document-text-cache
          # The orphan branch carries its own vercel.json so Vercel never tries to deploy it.
          printf '%s\n' '{"git":{"deploymentEnabled":false}}' > vercel.json
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "Document text $(date -u +%FT%TZ)" || exit 0
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:document-text-cache
