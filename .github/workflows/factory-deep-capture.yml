# Generated by scripts/build-jobs.mjs from chalamalasetti/PV-Info .github/workflows/factory-deep-capture.yml.
# Do not edit here: change the source file in PV-Info; the "Sync jobs from PV-Info" workflow rebuilds this.
name: Factory deep capture
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Most document versions to capture in this run
        type: string
        default: "200"
      dry_run:
        description: List the targets only
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: pv-factory-deep-capture
  cancel-in-progress: false
jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chalamalasetti/PV-Info
          ref: main
          token: ${{ secrets.PVINFO_CODE_TOKEN }}
          persist-credentials: false
      - name: Use the public data repository as origin
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Deep capture through the trusted relay
        env:
          LIMIT: ${{ inputs.limit }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          [[ "$LIMIT" =~ ^[0-9]{1,4}$ ]] || { echo "Invalid limit"; exit 1; }
          node scripts/factory/deep-capture.mjs --limit "$LIMIT" $DRY --by "deep-capture (GitHub job ${{ github.run_id }})"
