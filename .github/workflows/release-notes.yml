# Generated by scripts/build-jobs.mjs from chalamalasetti/PV-Info .github/workflows/release-notes.yml.
# Do not edit here: change the source file in PV-Info; the "Sync jobs from PV-Info" workflow rebuilds this.
name: Daily release notes
on:
  schedule:
    - cron: 45 23,0 * * *
    - cron: 50 0,1 * * *
  workflow_dispatch:
    inputs:
      mode:
        description: notes (build the candidate) or confirm (check production after 8 PM)
        type: choice
        options:
          - notes
          - confirm
        default: notes
      dry_run:
        description: Print the notes only; commit nothing
        type: boolean
        default: true
      from:
        description: Optional start commit for a preview (never saved; default - the commit production serves)
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: release-notes
  cancel-in-progress: false
jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: chalamalasetti/PV-Info
          ref: main
          token: ${{ secrets.PVINFO_CODE_TOKEN }}
          persist-credentials: false
      - name: Use the public data repository as origin
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: when
        name: Run only at 7:45 PM (notes) or 8:50 PM (confirm) New York, from 1 Dec 2026 (manual runs always)
        env:
          MODE_INPUT: ${{ inputs.mode }}
        run: |
          hour=$(TZ=America/New_York date +%H); today=$(TZ=America/New_York date +%F)
          echo "date=$today" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$hour" in 19) mode=notes;; 20) mode=confirm;; *) mode=none;; esac
            [[ "$today" < "2026-12-01" ]] && mode=none
          else mode="${MODE_INPUT:-notes}"; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = none ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Not a release evening in New York ($today $hour:xx); nothing to do."
          else echo "skip=false" >> "$GITHUB_OUTPUT"; echo "Mode: $mode"; fi
      - name: Ask production which version it serves
        if: steps.when.outputs.skip != 'true'
        run: |
          curl -fsS --max-time 20 -H 'cache-control: no-cache' 'https://www.pvinfo.org/api/deploy-window?info=1' > /tmp/prod.json || echo '{}' > /tmp/prod.json
          node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/prod.json','utf8'));console.log(p.env==='production'&&/^[0-9a-f]{40}$/.test(p.sha||'')?'Production serves '+p.sha.slice(0,7):'Production version could not be verified')"
      - name: Read the PV-Info checks for main
        if: steps.when.outputs.skip != 'true' && steps.when.outputs.mode == 'notes'
        env:
          GH_TOKEN: ${{ secrets.PVINFO_CODE_TOKEN }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api "repos/chalamalasetti/PV-Info/commits/$sha/status" > /tmp/status.json || echo '{"state":"pending","statuses":[]}' > /tmp/status.json
          node -e "
            const s=JSON.parse(require('fs').readFileSync('/tmp/status.json','utf8'));
            const mine=(s.statuses||[]).filter(x=>x.context.startsWith('PV-Info checks'));
            const ok=mine.length>0&&mine.every(x=>x.state==='success');
            const ci={run:(mine[0]?.target_url||'').split('/').pop()||null,conclusion:ok?'success':(mine.some(x=>['failure','error'].includes(x.state))?'failure':'pending'),tests:mine.map(x=>({check:x.context,state:x.state}))};
            require('fs').writeFileSync('/tmp/ci.json',JSON.stringify(ci));console.log('CI on '+'$sha'.slice(0,7)+': '+ci.conclusion);"
      - id: pack
        if: steps.when.outputs.skip != 'true' && steps.when.outputs.mode == 'notes'
        name: Build the candidate notes and evidence pack
        env:
          FROM_INPUT: ${{ inputs.from }}
        run: |
          set +e
          [ -z "$FROM_INPUT" ] || [[ "$FROM_INPUT" =~ ^[0-9a-f]{7,40}$ ]] || { echo "::error::from must be a commit sha"; exit 1; }
          node scripts/release/evidence-pack.mjs --prod /tmp/prod.json ${FROM_INPUT:+--from "$FROM_INPUT"} --date "${{ steps.when.outputs.date }}" --ci /tmp/ci.json
          code=$?; echo "exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = 3 ]; then
            echo "::error::The live production version could not be verified, so no notes were built."
            echo "## Release notes not built: the live production version could not be verified" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          f="docs/releases/daily/${{ steps.when.outputs.date }}.md"
          { echo "## Release notes preview"; echo; cat "$f"; } >> "$GITHUB_STEP_SUMMARY"
          echo "----- notes -----"; cat "$f"
          exit 0
      - id: confirm
        if: steps.when.outputs.skip != 'true' && steps.when.outputs.mode == 'confirm'
        name: Confirm the release against production
        run: |
          f="docs/releases/daily/${{ steps.when.outputs.date }}.evidence.json"
          [ -f "$f" ] || { echo "No candidate notes for ${{ steps.when.outputs.date }}; nothing to confirm."; echo "none=true" >> "$GITHUB_OUTPUT"; exit 0; }
          node scripts/release/evidence-pack.mjs --confirm "$f" --prod /tmp/prod.json
          md="docs/releases/daily/${{ steps.when.outputs.date }}.md"
          { echo "## Release notes after confirmation"; echo; cat "$md"; } >> "$GITHUB_STEP_SUMMARY"
          echo "----- notes -----"; cat "$md"
      - name: Commit the notes to PV-Info main
        if: steps.when.outputs.skip != 'true' && steps.confirm.outputs.none != 'true' && (github.event_name == 'schedule' || inputs.dry_run == false)
        env:
          RELEASE_TOKEN: ${{ secrets.PVINFO_RELEASE_TOKEN }}
          DAY: ${{ steps.when.outputs.date }}
          MODE: ${{ steps.when.outputs.mode }}
        run: |
          [ -n "$RELEASE_TOKEN" ] || { echo "::error::PVINFO_RELEASE_TOKEN is not set; notes were built but not saved."; exit 1; }
          verified=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).baseline?.verified===true))" "docs/releases/daily/$DAY.evidence.json")
          [ "$verified" = true ] || { echo "::error::The notes start from a manual range, not the verified production version; they are a preview and are not saved."; exit 1; }
          git add "docs/releases/daily/$DAY.md" "docs/releases/daily/$DAY.evidence.json"
          git diff --cached --quiet && { echo "Nothing new to commit."; exit 0; }
          msg="Release notes $DAY"; [ "$MODE" = confirm ] && msg="Release notes $DAY: confirmation"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "$msg"
          git -c http.https://github.com/.extraheader= push -q "https://x-access-token:${RELEASE_TOKEN}@github.com/chalamalasetti/PV-Info.git" HEAD:main
          echo "Committed: $msg."
