# Generated by scripts/build-jobs.mjs from chalamalasetti/PV-Info .github/workflows/feed-health.yml.
# Do not edit here: change the source file in PV-Info; the "Sync jobs from PV-Info" workflow rebuilds this.
name: Feed health check
on:
  schedule:
    - cron: 47 */6 * * *
  workflow_dispatch: null
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chalamalasetti/PV-Info
          ref: main
          token: ${{ secrets.PVINFO_CODE_TOKEN }}
          persist-credentials: false
      - name: Use the public data repository as origin
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the live data
        id: health
        run: node scripts/health.mjs
      - name: Open, update or close the alert issue
        uses: actions/github-script@v7
        env:
          HEALTHY: ${{ steps.health.outputs.healthy }}
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("report.md", "utf8");
            const label = "feed-alert";
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, labels: label, state: "open" });
            const issue = open[0];
            if (process.env.HEALTHY === "true") {
              if (issue) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Recovered: the latest check is healthy.\n\n${body}` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed", state_reason: "completed" });
              }
              return;
            }
            if (issue) {
              // Editing the body keeps the details current without emailing every hour.
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
              return;
            }
            try {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: "d93f0b", description: "Opened automatically when PV Info data stops refreshing" });
            } catch {}
            await github.rest.issues.create({ owner, repo, title: "PV Info data alert: a feed or scheduled data refresh needs attention", labels: [label], assignees: [owner], body });
