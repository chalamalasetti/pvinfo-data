# Generated by scripts/build-jobs.mjs from chalamalasetti/PV-Info .github/workflows/indexnow.yml.
# Do not edit here: change the source file in PV-Info; the "Sync jobs from PV-Info" workflow rebuilds this.
name: IndexNow
on:
  schedule:
    - cron: 29 7 * * *
  workflow_dispatch:
    inputs:
      all:
        description: Send every sitemap URL, not only recent changes
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chalamalasetti/PV-Info
          ref: main
          token: ${{ secrets.PVINFO_CODE_TOKEN }}
          persist-credentials: false
      - name: Use the public data repository as origin
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send changed pages to IndexNow
        env:
          INDEXNOW_ALL: ${{ inputs.all }}
        run: node scripts/indexnow.mjs
