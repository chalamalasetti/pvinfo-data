# Generated by scripts/build-jobs.mjs from chalamalasetti/PV-Info .github/workflows/label-dates.yml.
# Do not edit here: change the source file in PV-Info; the "Sync jobs from PV-Info" workflow rebuilds this.
name: Date labelled events from DailyMed history
on:
  schedule:
    - cron: 11 3 * * *
  workflow_dispatch:
    inputs:
      minutes:
        description: Time budget in minutes
        default: "40"
permissions:
  contents: write
concurrency:
  group: safety-data
  cancel-in-progress: false
jobs:
  dates:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chalamalasetti/PV-Info
          ref: main
          token: ${{ secrets.PVINFO_CODE_TOKEN }}
          persist-credentials: false
      - name: Use the public data repository as origin
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read latest product cache
        run: bash scripts/read-product-cache.sh || true
      - name: Bisect DailyMed label versions
        env:
          MINUTES: ${{ inputs.minutes || '40' }}
        run: node scripts/safety-data/label-dates.mjs --out output/label-dates --minutes "$MINUTES"
      - name: Publish the label-dates file without an app deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PVINFO_DATA_TOKEN }}
          script: |
            await require('./scripts/safety-data/publish.cjs')({github,context,core,directory:'output/label-dates',title:'Labelled event dates'});
