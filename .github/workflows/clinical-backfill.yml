# Generated by scripts/build-jobs.mjs from chalamalasetti/PV-Info .github/workflows/clinical-backfill.yml.
# Do not edit here: change the source file in PV-Info; the "Sync jobs from PV-Info" workflow rebuilds this.
name: Backfill public company clinical portfolios
on:
  schedule:
    - cron: 11 */6 * * *
  workflow_dispatch:
    inputs:
      force:
        description: Run immediately even if paused or not due
        type: boolean
        default: true
permissions:
  contents: write
  id-token: write
concurrency:
  group: clinical-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chalamalasetti/PV-Info
          ref: main
          token: ${{ secrets.PVINFO_CODE_TOKEN }}
          persist-credentials: false
      - name: Use the public data repository as origin
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check managed schedule and acquire run lease
        id: managed
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: node scripts/refresh-control.mjs claim clinical
      - name: Read previous checkpoints
        if: steps.managed.outputs.run == 'true'
        run: |
          mkdir -p /tmp/clinical-cache
          if git fetch https://github.com/chalamalasetti/pvinfo-data.git clinical-data-cache:refs/remotes/data/clinical-data-cache --depth=1; then
            git archive FETCH_HEAD clinical | tar -x -C /tmp/clinical-cache --strip-components=1
          fi
      - name: Collect configured company searches
        id: collect
        if: steps.managed.outputs.run == 'true'
        env:
          MODE: ${{ steps.managed.outputs.mode }}
        run: |
          if [ "$MODE" = 'fresh' ]; then node scripts/clinical-bulk.mjs /tmp/clinical-cache --refresh; else node scripts/clinical-bulk.mjs /tmp/clinical-cache; fi
      - name: Publish one checkpoint commit
        if: always() && steps.managed.outputs.run == 'true'
        env:
          DATA_TOKEN: ${{ secrets.PVINFO_DATA_TOKEN }}
        run: |
          test -f /tmp/clinical-cache/index.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/data/clinical-data-cache; then
            git worktree add -B clinical-data-cache /tmp/clinical-publication data/clinical-data-cache
          else
            git worktree add --orphan -b clinical-data-cache /tmp/clinical-publication
          fi
          mkdir -p /tmp/clinical-publication/clinical
          cp /tmp/clinical-cache/*.json /tmp/clinical-publication/clinical/
          mkdir -p /tmp/clinical-publication/clinical/checkpoints
          find /tmp/clinical-publication/clinical/checkpoints -name '*.json' -delete
          cp /tmp/clinical-cache/checkpoints/*.json /tmp/clinical-publication/clinical/checkpoints/ 2>/dev/null || true
          git -C /tmp/clinical-publication add clinical
          git -C /tmp/clinical-publication diff --cached --quiet && exit 0
          git -C /tmp/clinical-publication commit -m 'Checkpoint sanitized company clinical portfolios'
          git -C /tmp/clinical-publication -c http.https://github.com/.extraheader= push "https://x-access-token:${DATA_TOKEN}@github.com/chalamalasetti/pvinfo-data.git" HEAD:clinical-data-cache
      - name: Confirm portfolios staged for data publication
        id: publish
        if: success() && steps.managed.outputs.run == 'true'
        run: test -f /tmp/clinical-cache/index.json
      - name: Record managed collection outcome
        if: always() && steps.managed.outputs.run == 'true'
        env:
          RUN_LEASE: ${{ steps.managed.outputs.lease }}
          RUN_RESULT: ${{ steps.collect.outcome }}
          PUBLICATION: ${{ steps.publish.outcome }}
        run: node scripts/refresh-control.mjs finish clinical
